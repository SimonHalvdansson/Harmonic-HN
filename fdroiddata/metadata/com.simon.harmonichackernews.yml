Builds:
  - versionName: 3.2.9
    versionCode: 91
    commit: 83492be687c7d745b108b417ca051d3aae20aa3d
    subdir: app
    submodules: true
    sudo:
      - apt-get update
      - apt-get install -y build-essential cmake pkg-config libssl-dev
    gradle:
      - foss
    output: build/outputs/apk/fossRelease/app-fossRelease-unsigned.apk
    rm:
      - gradle/gradle-daemon-jvm.properties
      - resources/src/commonMain/composeResources/files/web/pdf/vendor/pdf.js/6.3.289/wasm/*.wasm
      - tools/pdf-wasm/sources/pdfium/testing
      - tools/pdf-wasm/sources/qcms/build.js
      - tools/pdf-wasm/sources/qcms/package.json
    prebuild: sed -i '/foojay/d' ../settings.gradle
    scanignore:
      - resources/src/commonMain/composeResources/files/article_categories.bin
    build: bash ../tools/pdf-wasm/build.sh
    ndk: 29.0.13113456
    preassemble:
      - verifyFossDependencies

AllowedAPKSigningKeys: fb12dbf6d0692512ed7018150637a1932eab09d67dbf9900457096a552f88ec6

MaintainerNotes: |-
  article_categories.bin contains training data for the article classifier. The generator and corpus are in tools/article_categories.

  The build removes the bundled PDF.js WebAssembly modules before scanning. Harmonic pins the decoder sources as Git submodules. Its build script compiles JBIG2 with Emscripten 5.0.0, OpenJPEG with Emscripten 5.0.6, and QCMS with Rust 1.97.1 and wasm-bindgen 0.2.126. It checks all three SHA-256 digests before packaging.

  The upstream signer preserves Gradle's ZIP alignment.

