pluginManagement {
    repositories {
        google()
        gradlePluginPortal()
    }
}
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

// Non-Android CI hosts still use the KMP modules, but do not need to configure
// the Android application/dynamic feature (which installs the Android NDK).
if (providers.gradleProperty('harmonicAndroidHostEnabled').getOrElse('true').toBoolean()) {
    include ':app'
    include ':local_ai_runtime'
    include ':benchmark'
}
include ':resources'
include ':core'
include ':ui'
include ':desktop_app'
rootProject.name = "Harmonic Hacker News"
