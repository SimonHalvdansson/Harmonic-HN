tasks.register("installBenchmarkBaselineProfile", Copy) {
    dependsOn(":benchmark:collectNonMinifiedBenchmarkBaselineProfile")
    from(project(":benchmark").layout.buildDirectory.dir("intermediates/baselineprofiles/nonMinifiedBenchmark")) {
        include("*-baseline-prof-*.txt")
        filter { line -> line.contains("com/simon/harmonichackernews") ? line : null }
        rename { "baseline-prof.txt" }
    }
    into(layout.projectDirectory.dir("src/main"))
}

afterEvaluate {
    def fossReleaseRuntimeClasspath = configurations.named("fossReleaseRuntimeClasspath")
    def forbiddenFossGroupPrefixes = [
            "com.google.ai.edge",
            "com.google.android.datatransport",
            "com.google.android.gms",
            "com.google.android.play",
            "com.google.firebase",
            "com.google.mlkit"
    ] as Set<String>
    def forbiddenFossDependencies = fossReleaseRuntimeClasspath.map { configuration ->
        configuration.resolvedConfiguration.resolvedArtifacts
                .collect { artifact ->
                    "${artifact.moduleVersion.id.group}:${artifact.name}:${artifact.moduleVersion.id.version}"
                }
                .findAll { dependency ->
                    forbiddenFossGroupPrefixes.any { prefix ->
                        dependency.startsWith(prefix + ":")
                    }
                }
                .sort()
    }

    tasks.register("verifyFossDependencies") {
        group = "verification"
        description =
                "Fails if the FOSS release resolves proprietary local-AI or Play libraries."
        inputs.property("forbiddenDependencies", forbiddenFossDependencies)

        doLast {
            List<String> resolvedForbiddenDependencies = forbiddenFossDependencies.get()
            if (!resolvedForbiddenDependencies.isEmpty()) {
                throw new GradleException(
                        "FOSS release contains forbidden dependencies:\n"
                                + resolvedForbiddenDependencies.join("\n"))
            }
        }
    }
}
java {
