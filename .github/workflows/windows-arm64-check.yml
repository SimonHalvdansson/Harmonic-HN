{
  "name": "Windows ARM64 installer check",
  "on": {
    "push": {
      "branches": [
        "codex/windows-arm64-installer-20261031-070855"
      ]
    }
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "jobs": {
    "desktop": {
      "name": "Desktop ${{ matrix.artifact_name }}",
      "runs-on": "${{ matrix.os }}",
      "env": {
        "ORG_GRADLE_PROJECT_harmonicAndroidHostEnabled": "false",
        "ORG_GRADLE_PROJECT_harmonicDesktopOptimize": "${{ matrix.os == 'macos-15' }}"
      },
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "include": [
            {
              "os": "windows-11-arm",
              "task": "createReleaseDistributable",
              "artifact_name": "windows-exe-arm64",
              "artifact_path": "desktop_app/build/compose/binaries/main-release/exe/*.exe"
            }
          ]
        }
      },
      "steps": [
        {
          "uses": "actions/checkout@v7"
        },
        {
          "uses": "actions/setup-java@v6",
          "with": {
            "distribution": "${{ matrix.os == 'windows-11-arm' && 'microsoft' || 'temurin' }}",
            "java-version": "21",
            "architecture": "${{ runner.arch == 'ARM64' && 'aarch64' || 'x64' }}"
          }
        },
        {
          "name": "Select Windows ARM64 packaging JDK",
          "if": "matrix.os == 'windows-11-arm'",
          "shell": "bash",
          "run": "echo \"ORG_GRADLE_PROJECT_harmonicDesktopJavaHome=$JAVA_HOME\" >> \"$GITHUB_ENV\""
        },
        {
          "uses": "gradle/actions/setup-gradle@v6",
          "with": {
            "cache-read-only": false
          }
        },
        {
          "name": "Set up Android SDK",
          "uses": "android-actions/setup-android@v4"
        },
        {
          "name": "Install Linux ARM64 desktop dependencies",
          "if": "matrix.os == 'ubuntu-24.04-arm'",
          "run": "sudo apt-get update\nsudo apt-get install --no-install-recommends -y fakeroot xvfb xauth libgl1 libgl1-mesa-dri libegl1 libfontconfig1 libfreetype6 libasound2t64 libx11-6 libxext6 libxi6 libxrender1 libxtst6\n"
        },
        {
          "uses": "./.github/actions/cache-desktop-native"
        },
        {
          "name": "Download previously verified native build",
          "uses": "actions/download-artifact@v8",
          "with": {
            "name": "windows-arm64-built-image-diagnostics",
            "run-id": 41177159727,
            "github-token": "${{ secrets.GITHUB_TOKEN }}",
            "path": "${{ runner.temp }}/previous-arm64-build"
          }
        },
        {
          "name": "Reuse unchanged verified native DLL",
          "shell": "pwsh",
          "run": "$native = Join-Path $env:RUNNER_TEMP 'previous-arm64-build/desktopLocalAi/output'\npython -B -c 'import sys; sys.path.insert(0, \".github/scripts\"); from pathlib import Path; from package_windows_arm64 import require_arm64_pe; require_arm64_pe(Path(sys.argv[1]))' (Join-Path $native 'harmonic-local-ai.dll')\nif ($LASTEXITCODE -ne 0) { throw 'Invalid previous ARM64 DLL' }\n\"ORG_GRADLE_PROJECT_harmonicDesktopLocalAiPrebuilt=$native\" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append"
        },
        {
          "name": "Add WiX Toolset to PATH",
          "if": "runner.os == 'Windows' && runner.arch != 'ARM64'",
          "shell": "pwsh",
          "run": "$wix = Get-ChildItem \"${env:ProgramFiles(x86)}\\WiX Toolset v3.*\\bin\" -Directory |\n  Select-Object -First 1\nif (-not $wix) {\n  throw \"WiX Toolset 3.x is required to build the MSI\"\n}\n$wix.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append\n"
        },
        {
          "name": "Test Windows ARM64 installer scripts",
          "if": "matrix.os == 'windows-11-arm'",
          "run": "python -B -m unittest discover -s .github/scripts -p 'test_package_windows_arm64.py'"
        },
        {
          "name": "Build desktop package",
          "shell": "bash",
          "run": "if [ \"$RUNNER_OS\" = \"Linux\" ]; then\n  xvfb-run --auto-servernum ./gradlew :desktop_app:${{ matrix.task }} --warning-mode all --no-daemon --max-workers=2\nelse\n  ./gradlew :desktop_app:${{ matrix.task }} --warning-mode all --no-daemon --max-workers=2\nfi\n"
        },
        {
          "name": "Verify desktop native library",
          "shell": "bash",
          "run": "python .github/scripts/verify-desktop-native.py desktop_app/build/generated/desktopLocalAiResources/native"
        },
        {
          "name": "Verify desktop AppCDS archive",
          "if": "matrix.os != 'windows-11-arm'",
          "run": "python .github/scripts/verify-desktop-appcds.py desktop_app/build/compose/binaries/main-release/app"
        },
        {
          "name": "Verify processed desktop runtime",
          "run": "java -Xverify:all \"-Djava.awt.headless=true\" -cp \"desktop_app/build/compose/tmp/main-release/proguard/*\" .github/scripts/VerifyDesktopRelease.java"
        },
        {
          "name": "Build Windows ARM64 installer",
          "if": "matrix.os == 'windows-11-arm'",
          "run": "python .github/scripts/package_windows_arm64.py"
        },
        {
          "name": "Verify Windows ARM64 installation and uninstallation",
          "if": "matrix.os == 'windows-11-arm'",
          "shell": "pwsh",
          "run": ".github/scripts/verify_windows_arm64_install.ps1"
        },
        {
          "name": "Upload Windows ARM64 verification logs",
          "if": "failure() && matrix.os == 'windows-11-arm'",
          "uses": "actions/upload-artifact@v7",
          "with": {
            "name": "windows-arm64-verification-logs",
            "path": "${{ runner.temp }}/harmonic-arm64-verification/*.log",
            "if-no-files-found": "ignore"
          }
        },
        {
          "uses": "actions/upload-artifact@v7",
          "with": {
            "name": "harmonic-${{ matrix.artifact_name }}",
            "path": "${{ matrix.artifact_path }}",
            "if-no-files-found": "error"
          },
          "if": "always()"
        }
      ],
      "timeout-minutes": 35
    },
    "fresh-install": {
      "name": "Install on a fresh Windows ARM64 host",
      "needs": "desktop",
      "runs-on": "windows-11-arm",
      "timeout-minutes": 10,
      "steps": [
        {
          "uses": "actions/checkout@v7"
        },
        {
          "name": "Download the standalone EXE installer",
          "uses": "actions/download-artifact@v8",
          "with": {
            "name": "harmonic-windows-exe-arm64",
            "path": "${{ runner.temp }}/fresh-installer"
          }
        },
        {
          "name": "Install, upgrade, launch and uninstall without a build environment",
          "shell": "pwsh",
          "run": "if (Test-Path 'desktop_app/build/compose/binaries/main-release/app/Harmonic') { throw 'Fresh-host test has an unexpected build image' }\n.github/scripts/verify_windows_arm64_install.ps1 -InstallerDirectory (Join-Path $env:RUNNER_TEMP 'fresh-installer')"
        },
        {
          "name": "Upload installation logs on failure",
          "if": "failure()",
          "uses": "actions/upload-artifact@v7",
          "with": {
            "name": "fresh-windows-arm64-install-logs",
            "path": "${{ runner.temp }}/harmonic-arm64-verification/*.log",
            "if-no-files-found": "ignore"
          }
        }
      ]
    }
  }
}
