on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Shared and host tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Run shared, Android host, and desktop tests
        run: >-
          ./gradlew
          :shared_resources:verifyGeneratedAdblocklist
          :shared_logic:desktopTest
          :shared_logic:testAndroidHostTest
          :shared_ui:desktopTest
          :shared_ui:testAndroidHostTest
          :desktop_app:desktopTest
          :app:testDebugUnitTest
          --warning-mode all
          --no-daemon
          --parallel

  build:
    needs: verify
    runs-on: ubuntu-latest
    env:
      BUNDLETOOL_VERSION: '1.18.3'
      BUNDLETOOL_SHA256: 'A099CFA1543F55593BC2ED16A70A7C67FE54B1747BB7301F37FDFD6D91028E29'
      RELEASE_BUNDLE: app/build/outputs/bundle/playRelease/app-playRelease.aab
      CI_LLM_APKS: app/build/outputs/apk/playRelease/app-release-llm-ci.apks
      CI_LLM_APK: app/build/outputs/apk/playRelease/app-release-llm-ci.apk
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install native build tools
        run: sdkmanager "ndk;29.0.13113456" "cmake;3.22.1"
      - name: Build with Gradle
        run: >-
          ./gradlew
          :app:assembleFossRelease
          :app:bundlePlayRelease
          :app:lintFossRelease
          :app:lintPlayRelease
          :app:verifyFossDependencies
          --warning-mode all
          --no-daemon
          --parallel
      - name: Build fused LLM APK
        run: |
          set -euo pipefail

          BUNDLETOOL_JAR="$RUNNER_TEMP/bundletool.jar"
          KEYSTORE_PATH="$RUNNER_TEMP/ci-debug.jks"
          KEYSTORE_PASSWORD_FILE="$RUNNER_TEMP/ci-keystore-password.txt"
          KEY_PASSWORD_FILE="$RUNNER_TEMP/ci-key-password.txt"

          curl -fsSL \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar" \
            -o "$BUNDLETOOL_JAR"
          echo "${BUNDLETOOL_SHA256}  ${BUNDLETOOL_JAR}" | sha256sum --check -

          printf '%s' 'android' > "$KEYSTORE_PASSWORD_FILE"
          printf '%s' 'android' > "$KEY_PASSWORD_FILE"
          keytool -genkeypair -noprompt \
            -keystore "$KEYSTORE_PATH" \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          java -jar "$BUNDLETOOL_JAR" build-apks \
            --bundle="$RELEASE_BUNDLE" \
            --output="$CI_LLM_APKS" \
            --mode=universal \
            --ks="$KEYSTORE_PATH" \
            --ks-pass="file:$KEYSTORE_PASSWORD_FILE" \
            --ks-key-alias=androiddebugkey \
            --key-pass="file:$KEY_PASSWORD_FILE" \
            --overwrite
          unzip -p "$CI_LLM_APKS" universal.apk > "$CI_LLM_APK"
          unzip -t "$CI_LLM_APK" 'lib/*/liblocal-llama.so'
      - uses: actions/upload-artifact@v7
        with:
          name: apks
          path: |
            app/build/outputs/apk
            app/build/outputs/bundle/playRelease/app-playRelease.aab

  desktop:
    name: Desktop ${{ matrix.artifact_name }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            task: packageReleaseDmg
            artifact_name: macos-dmg-arm64
            artifact_path: desktop_app/build/compose/binaries/**/*.dmg
          - os: windows-2025
            task: packageReleaseMsi
            artifact_name: windows-msi-x64
            artifact_path: desktop_app/build/compose/binaries/**/*.msi
          - os: ubuntu-24.04
            task: packageReleaseDeb
            artifact_name: linux-deb-x64
            artifact_path: desktop_app/build/compose/binaries/**/*.deb
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Add WiX Toolset to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $wix = Get-ChildItem "${env:ProgramFiles(x86)}\WiX Toolset v3.*\bin" -Directory |
            Select-Object -First 1
          if (-not $wix) {
            throw "WiX Toolset 3.x is required to build the MSI"
          }
          $wix.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build desktop package
        run: ./gradlew :desktop_app:${{ matrix.task }} --warning-mode all --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: harmonic-${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  ios:
    name: iOS KMP and Xcode verification
    needs: verify
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run iOS KMP tests
        run: >-
          ./gradlew
          :shared_logic:iosSimulatorArm64Test
          :shared_ui:iosSimulatorArm64Test
          --warning-mode all
          --no-daemon
          --parallel
      - name: Compile the iOS host and UI tests
        run: >-
          xcodebuild
          -project ios_app/HarmonicIos.xcodeproj
          -scheme HarmonicIos
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          ARCHS=arm64
          ONLY_ACTIVE_ARCH=YES
          CODE_SIGNING_ALLOWED=NO
          build-for-testing
